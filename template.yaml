AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Native Lyfe Captures Tile Engine on one-off ECS Fargate tasks

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        OUTPUT_BUCKET: !Ref OutputBucket

Resources:
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteDemoExports
            Status: Enabled
            ExpirationInDays: 1

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EngineRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep five images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  EngineCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  EngineBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildTileEngineImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${OutputBucket.Arn}/build/engine.zip"
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EngineRepository.Arn

  EngineBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt EngineBuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt EngineRepository.RepositoryUri
      Source:
        Type: S3
        Location: !Sub "${OutputBucket}/build/engine.zip"
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
            build:
              commands:
                - docker build -t $REPOSITORY_URI:latest .
                - docker push $REPOSITORY_URI:latest

  EngineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only security group for one-off Tile Engine tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  EngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  EngineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TileEngineJobStorage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${OutputBucket.Arn}/jobs/*"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt JobsTable.Arn

  EngineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EngineTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: jmh-lyfe-captures-tile-engine
      Cpu: "1024"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EngineExecutionRole.Arn
      TaskRoleArn: !GetAtt EngineTaskRole.Arn
      ContainerDefinitions:
        - Name: tile-engine
          Image: !Sub "${EngineRepository.RepositoryUri}:latest"
          Essential: true
          Environment:
            - Name: OUTPUT_BUCKET
              Value: !Ref OutputBucket
            - Name: JOBS_TABLE
              Value: !Ref JobsTable
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EngineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: engine

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          ECS_CLUSTER_ARN: !GetAtt EngineCluster.Arn
          TASK_DEFINITION_ARN: !Ref EngineTaskDefinition
          CONTAINER_NAME: tile-engine
          TASK_SUBNETS: !Join [",", !Ref PublicSubnets]
          TASK_SECURITY_GROUPS: !Ref EngineSecurityGroup
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref JobsTable}
        - S3CrudPolicy: {BucketName: !Ref OutputBucket}
        - Statement:
            - Effect: Allow
              Action: [ecs:RunTask, ecs:TagResource]
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt EngineTaskRole.Arn
                - !GetAtt EngineExecutionRole.Arn
      Events:
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref DemoApi
            Path: /jobs
            Method: POST
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref DemoApi
            Path: /jobs/{jobId}
            Method: GET

  DemoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [https://josephmhernandez.com]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 3
        ThrottlingRateLimit: 1

Outputs:
  ApiUrl:
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  OutputBucketName:
    Value: !Ref OutputBucket
  EngineRepositoryUri:
    Value: !GetAtt EngineRepository.RepositoryUri
  EngineClusterArn:
    Value: !GetAtt EngineCluster.Arn
  EngineBuildProjectName:
    Value: !Ref EngineBuildProject
